name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the main ref available for git-range checks
        run: git fetch origin main:main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck -w @releasedesk/core
      - run: npm run typecheck -w @releasedesk/lead
      - run: npm run typecheck -w @releasedesk/specialists
      - run: npm run typecheck -w @releasedesk/ui
