name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck -w @releasedesk/core
      - run: npm run typecheck -w @releasedesk/lead
      - run: npm run typecheck -w @releasedesk/specialists
      - run: npm run typecheck -w @releasedesk/ui
      - name: PHP intake tests
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl
          bash apps/intake/tests/run-tests.sh
