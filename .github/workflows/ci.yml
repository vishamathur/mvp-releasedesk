name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Make the main ref available for git-range checks
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            git branch -f main origin/main
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck -w @releasedesk/core
      - run: npm run typecheck -w @releasedesk/lead
      - run: npm run typecheck -w @releasedesk/specialists
      - run: npm run typecheck -w @releasedesk/ui
      - name: PHP intake tests
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl
          bash apps/intake/tests/run-tests.sh
      - name: Python intake extract and verifier tests
        run: python3 -m unittest apps/intake-cloudflare/scripts/test_extract_intake.py apps/intake-cloudflare/scripts/test_verify_intake_ref.py

  intake-cloudflare:
    # Cloudflare Pages port of apps/intake plus the Intake-inline verifier. No secrets, no network, no Cloudflare account:
    # node:test against in-memory SQLite (node:sqlite needs Node 22.13+) and python3 for grok-bots/tools/verify_intake.py.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build Pages output
        run: node apps/intake-cloudflare/scripts/build.mjs
      - name: Check the generated catalogue is committed
        run: git diff --exit-code -- apps/intake-cloudflare/src/catalogue-data.mjs
      - name: Cloudflare intake tests
        run: node --test "apps/intake-cloudflare/test/*.test.mjs"
      - name: Python intake extract and verifier tests
        run: python3 -m unittest apps/intake-cloudflare/scripts/test_extract_intake.py apps/intake-cloudflare/scripts/test_verify_intake_ref.py
