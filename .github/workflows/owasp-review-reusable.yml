# Reusable OWASP review for customer repos.
# Called from a customer repo's owasp-review.yml. Same behaviour as owasp-review.yml in this repo:
# a missing key or a failed review fails the check and writes a needs-human comment.
name: owasp-review-reusable

on:
  workflow_call:
    inputs:
      harness_ref:
        description: Harness ref to run (branch, tag or SHA)
        type: string
        default: main
    secrets:
      grok_api_key:
        description: The caller repo's own Grok key (RELEASEDESK_GROK_API_KEY_LEAD)
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vishamathur/mvp-releasedesk
          ref: ${{ inputs.harness_ref }}
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
        working-directory: harness
      - run: npm run build:core
        working-directory: harness
      - name: Review the pull request diff
        working-directory: harness
        env:
          RELEASEDESK_GROK_API_KEY_LEAD: ${{ secrets.grok_api_key }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          ./node_modules/.bin/tsx scripts/owasp-review-pr.ts --comment > "$RUNNER_TEMP/owasp-review-comment.md"
          code=$?
          set -e
          if [ ! -s "$RUNNER_TEMP/owasp-review-comment.md" ]; then
            printf '%s\n' "## owasp-review v1" "" "Status: failed. Risk: not assessed. Outcome: needs-human. The review script produced no comment." > "$RUNNER_TEMP/owasp-review-comment.md"
            code=1
          fi
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | startswith("## owasp-review v1")) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$(cat "$RUNNER_TEMP/owasp-review-comment.md")"
          else
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$(cat "$RUNNER_TEMP/owasp-review-comment.md")"
          fi
          exit "$code"
