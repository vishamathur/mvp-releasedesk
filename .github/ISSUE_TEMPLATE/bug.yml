name: Bug
description: Something does not work as specified.
title: "bug: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour (Given / When / Then)
      value: |
        Given <context>
        When <action>
        Then <expected outcome>
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["critical", "high", "medium", "low"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is a security issue (if yes, do not file here; follow SECURITY.md)
